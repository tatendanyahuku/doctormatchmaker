{% extends "layout.html" %}

{% block title %}Find a Doctor - MedConsult{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Find a Doctor</h2>
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-body">
                    <form method="POST" id="find-doctor-form">
                        {{ form.hidden_tag() }}
                        {{ form.csrf_token }}
                        <div class="form-group mb-3">
                            <label for="specialty">Select Specialty:</label>
                            <select name="specialty" id="specialty" class="form-control" required>
                                {% for specialty in form.specialty.choices %}
                                    <option value="{{ specialty[0] }}">{{ specialty[1] }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="fee-info mt-4 mb-3" style="display: none;">
                            <h5>Recommended Fees for <span id="selectedSpecialty"></span></h5>
                            <div class="d-flex justify-content-between mb-2">
                                <span>Minimum: $<span id="minFee">0</span></span>
                                <span>Recommended: $<span id="recommendedFee">0</span></span>
                                <span>Maximum: $<span id="maxFee">0</span></span>
                            </div>
                            <input type="range" class="form-range" id="feeSlider" min="0" max="100" step="5">
                        </div>

                        <div class="form-group mb-3">
                            <label for="proposed_fee">Your Proposed Fee ($):</label>
                            <input type="number" name="proposed_fee" id="proposed-fee" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-primary">Submit Offer</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const specialtySelect = document.getElementById('specialty');
    const feeInfo = document.querySelector('.fee-info');
    const selectedSpecialtySpan = document.getElementById('selectedSpecialty');
    const minFeeSpan = document.getElementById('minFee');
    const recommendedFeeSpan = document.getElementById('recommendedFee');
    const maxFeeSpan = document.getElementById('maxFee');
    const feeSlider = document.getElementById('feeSlider');
    const proposedFeeInput = document.getElementById('proposed-fee');
    const recommendedFeeLink = document.getElementById('recommended-fee-link');

    // Fetch specialty fee ranges when specialty changes
    specialtySelect.addEventListener('change', function() {
        if (this.value) {
            fetch(`/api/specialties?specialty=${this.value}`)
                .then(response => response.json())
                .then(data => {
                    const specialty = data.find(s => s.name === this.value);
                    if (specialty) {
                        selectedSpecialtySpan.textContent = specialty.name;
                        minFeeSpan.textContent = specialty.min_fee;
                        recommendedFeeSpan.textContent = specialty.recommended_fee;
                        maxFeeSpan.textContent = specialty.max_fee;

                        feeSlider.min = specialty.min_fee;
                        feeSlider.max = specialty.max_fee;
                        feeSlider.value = specialty.recommended_fee;
                        proposedFeeInput.value = specialty.recommended_fee;

                        feeInfo.style.display = 'block';
                    }
                });
        } else {
            feeInfo.style.display = 'none';
        }
    });

    // Update proposed fee when slider changes
    feeSlider.addEventListener('input', function() {
        proposedFeeInput.value = this.value;
    });

    // Update slider when proposed fee changes
    proposedFeeInput.addEventListener('input', function() {
        feeSlider.value = this.value;
    });

    // Handle recommended fee link click
    recommendedFeeLink.addEventListener('click', function(event) {
        event.preventDefault();
        proposedFeeInput.value = recommendedFeeSpan.textContent;
    });

    // Handle form submission
    document.getElementById('find-doctor-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            specialty: specialtySelect.value,
            proposed_fee: parseFloat(proposedFeeInput.value)
        };

        fetch('/patient/find-doctor', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'success') {
                window.location.href = '/patient/view-offers/' + data.offer_id;
            }
        });
    });
});
</script>
{% endblock %}
